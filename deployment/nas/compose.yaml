services:
  app:
    build:
      context: ../..
      dockerfile: deployment/nas/Dockerfile
      # This NAS's Docker bridge cannot resolve external DNS. Build through
      # the NAS network so pip can reach PyPI.
      network: host
    container_name: company-portal-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3307
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_news}
      MYSQL_USER: ${MYSQL_USER:-portal_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      TZ: Asia/Taipei
    # The app uses the NAS network because Docker bridge DNS is unavailable.
    # Gunicorn itself listens only on 127.0.0.1; DSM Reverse Proxy connects there.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: company-portal-mysql:latest
    build:
      context: ../..
      dockerfile: deployment/nas/MySQL.Dockerfile
      network: host
    container_name: company-portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_news}
      MYSQL_USER: ${MYSQL_USER:-portal_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Taipei
    # MySQL is available only to the host-network app, never the LAN/internet.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      # A first MySQL initialization on DS220 can take more than two minutes.
      start_period: 4m

volumes:
  mysql_data:
    name: company_portal_mysql_data

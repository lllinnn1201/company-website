services:
  app:
    build:
      context: ../..
      dockerfile: deployment/nas/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_news}
      MYSQL_USER: ${MYSQL_USER:-portal_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      TZ: Asia/Taipei
    # The base image is also used for the NAS deployment, where Gunicorn must
    # bind to localhost.  In this private Docker network it needs to accept
    # requests from Caddy instead.
    command: ["gunicorn", "--workers", "2", "--bind", "0.0.0.0:8000", "app:app"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    build:
      context: ../..
      dockerfile: deployment/nas/MySQL.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_news}
      MYSQL_USER: ${MYSQL_USER:-portal_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Taipei
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 4m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
